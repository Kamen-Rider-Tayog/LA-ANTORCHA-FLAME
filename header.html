<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/header-style.css">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/80556710521d23086f530e782e89b377?family=Shelley+Script+LT+W01" rel="stylesheet">
</head>
<body>
    <header id="page-header">
    <div class="header-content">
        <a href="index.html" class="logo" target="_parent">
            <img src="assets/images/logo.png" alt="logo">
        </a>
        <h1>La Antorcha Flame</h1>
    </div>
    <nav>
        <div class="burger-menu" id="burgerMenu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul id="navMenu">
            <li><a href="index.html" class="" target="_parent">Home</a></li>
            <li><a href="about.html" target="_parent">About</a></li>
            <li><a href="product.html" target="_parent">Product</a></li>
        </ul>
    </nav>
</header>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const burgerMenu = document.getElementById('burgerMenu');
        const navMenu = document.getElementById('navMenu');
        
        burgerMenu.addEventListener('click', function() {
            burgerMenu.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
        
        const navLinks = document.querySelectorAll('#navMenu a');
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                burgerMenu.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    });
</script>
</body>
</html>
