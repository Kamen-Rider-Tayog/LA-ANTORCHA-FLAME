<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#5c2f2d">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>LA ANTORCHA FLAME</title>
</head>
<body>
    <iframe src="header.html" width="100%"></iframe>

    <main>
        <section class="hero-section">
            <div class="left-hero">
                <div class="tagline">
                    <p class="up-tagline">SCENTED WITH VALUES</p>
                    <p class="sub-tagline">- LIT WITH PASSION -</p>
                    <p class="hero-description">Each piece is meticulously crafted, 
                        embodying a commitment to ethical sourcing and exceptional, 
                        high-quality ingredients. This dedication ensures that every 
                        product you bring home offers a rich, authentic experience 
                        created with deep care and integrity.</p>
                </div>

                <div class="hero-images">
                    <div class="hero-shape-1">
                        <div class="thumbnail active" data-image="assets/images/candle 1.png">
                            <div class="selection-circle"><div></div></div>
                            <img src="assets/images/candle 1.png" alt="Candle 1">
                        </div>
                        <div class="thumbnail" data-image="assets/images/candle 2.png">
                            <div class="selection-circle"></div>
                            <img src="assets/images/candle 2.png" alt="Candle 2">
                        </div>
                        <div class="thumbnail" data-image="assets/images/candle 3.png">
                            <div class="selection-circle"></div>
                            <img src="assets/images/candle 3.png" alt="Candle 3">
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-hero">
                <div class="hero-shape-2">
                    <img src="assets/images/candle 1.png" alt="Selected Candle" id="main-candle-image">
                </div>
            </div>
        </section>

        <section></section>
        <section></section>
        <section></section>
        <section></section>
    </main>

    <iframe src="footer.html" width="100%"></iframe>
    
    <script src="scripts/gallery.js"></script>
</body>
</html>
